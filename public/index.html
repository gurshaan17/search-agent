<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fieldnote — research chat</title>
<style>
:root{font-family:Optima,Candara,'Segoe UI',sans-serif;color:#182f4a;background:#edf3fa;font-size:16px;line-height:1.65;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}a{color:#194fb4;text-underline-offset:3px}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #527fcf;outline-offset:4px}header{max-width:960px;margin:auto;padding:25px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #c8d5e5}.brand{font-size:25px;font-weight:700;letter-spacing:-1px}.brand span{color:#42678d;font-size:14px;font-weight:400;letter-spacing:0;margin-left:15px}.quiet{border:1px solid #9bb1ca;background:transparent;color:#182f4a;border-radius:6px;padding:7px 15px}main{max-width:820px;margin:auto;padding:32px 28px 225px}.intro{padding:40px 0 32px}.intro h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,48px);line-height:1.2;font-weight:400;max-width:570px;margin:0 0 18px;letter-spacing:-1.5px}.intro p{max-width:550px;color:#526981}.examples{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.examples button{border:1px solid #b6c8dd;border-radius:6px;background:#fff;padding:10px 14px;color:#264564;text-align:left}.message{margin:24px 0 34px;scroll-margin-top:24px}.message h2{font-size:13px;font-weight:600;margin:0 0 10px;color:#526981}.message.user{padding:16px 20px;background:#dfeaf8;border-radius:10px}.message.user .body{white-space:pre-wrap}.body{overflow-wrap:anywhere}.body p{white-space:pre-wrap;margin:0 0 14px}.body code{font-family:ui-monospace,monospace;background:#dfe8f2;padding:2px 4px;border-radius:3px;font-size:.9em}.body pre{white-space:pre-wrap;padding:16px;background:#dfe8f2;overflow:auto}.body table{border-collapse:collapse;font-size:14px;display:block;overflow:auto;margin:16px 0}.body th,.body td{padding:9px 12px;border:1px solid #c1d0e2;text-align:left;min-width:100px}.body .citation{font-size:.8em;vertical-align:super;margin:0 2px}.sources{border-left:3px solid #9db6d6;padding:0 0 0 20px;margin:22px 0;font-size:14px}.sources:empty{display:none}.sources li{margin:8px 0;scroll-margin-top:25px}.sources small{color:#526981;display:block}.composer-wrap{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#edf3fa 20%);padding:30px 24px 20px}.composer{max-width:764px;margin:auto;background:white;border:1px solid #a7bbd3;border-radius:12px;padding:13px;box-shadow:0 5px 22px #23456b0d}.composer label{font-size:13px;color:#526981;display:block}.composer textarea{display:block;width:100%;resize:vertical;min-height:62px;max-height:170px;border:0;background:white;color:#182f4a;padding:6px 0;outline-offset:0}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:15px}.composer-bottom p{font-size:12px;color:#526981;margin:0}.primary{border:0;border-radius:6px;background:#2459b8;color:white;padding:8px 23px}.status{max-width:764px;margin:0 auto 8px;font-size:13px;color:#375b84;min-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.error{color:#a02c37;font-size:14px}#stop{margin-right:8px}[hidden]{display:none!important}@media(max-width:540px){header{padding:16px 20px}.brand span{display:none}main{padding:18px 20px 240px}.intro{padding-top:24px}.composer-wrap{padding:22px 12px 12px}.composer-bottom p{max-width:175px;font-size:11px}.examples{display:grid}.intro h1{font-size:36px}}@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<header><div class="brand">Fieldnote<span>Research with a memory</span></div><button class="quiet" id="new">New chat</button></header>
<main id="thread" aria-label="Conversation">
<section class="intro" id="intro"><h1>Find the answer.<br>Keep the evidence.</h1><p>Ask about what’s current, compare your options, or revisit something you asked before.</p><div class="examples"><button data-prompt="What's the latest stable Node.js release?">Check a release</button><button data-prompt="Compare Postgres hosting pricing on Neon, Supabase, and RDS.">Compare hosting prices</button></div></section>
</main>
<div class="composer-wrap"><p class="status" id="status" role="status" aria-live="polite">Ready when you are.</p><form class="composer" id="form"><label for="input">Your question</label><textarea id="input" placeholder="What would you like to find out?" required maxlength="20000" rows="2"></textarea><div class="composer-bottom"><p>Saved on this browser’s research history.</p><div><button type="button" class="quiet" id="stop" hidden>Stop</button><button class="primary" id="send" type="submit">Ask</button></div></div></form></div>
<script type="module">
const $ = id => document.getElementById(id);
const thread = $('thread'), input = $('input'), status = $('status');
let userId, conversationId;
try {
  userId = localStorage.getItem('fieldnote-user') || crypto.randomUUID();
  conversationId = localStorage.getItem('fieldnote-conversation') || crypto.randomUUID();
  localStorage.setItem('fieldnote-user',userId);localStorage.setItem('fieldnote-conversation',conversationId);
} catch { userId = crypto.randomUUID();conversationId = crypto.randomUUID();status.textContent = 'Browser storage is unavailable; history will last for this page visit.'; }
let active;
function safeURL(raw){try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function inline(parent,text,sources,prefix){
  // Build DOM nodes directly; model text is never parsed as HTML.
  const pattern = /\[([0-9]+(?:\s*,\s*[0-9]+)*)\]|\*\*([^*\n]+)\*\*|`([^`\n]+)`|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
  let end=0;for(const match of text.matchAll(pattern)){
    parent.append(document.createTextNode(text.slice(end,match.index)));end=match.index+match[0].length;
    if(match[1]){for(const n of match[1].split(',').map(s=>Number(s.trim()))){if(sources.has(n)){const a=document.createElement('a');a.className='citation';a.href=`#${prefix}-source-${n}`;a.textContent=`[${n}]`;a.setAttribute('aria-label',`Source ${n}`);parent.append(a);}else parent.append(document.createTextNode(`[${n}]`));}}
    else if(match[2]||match[3]){const el=document.createElement(match[2]?'strong':'code');el.textContent=match[2]||match[3];parent.append(el);}
    else {const url=safeURL(match[5]);if(url){const a=document.createElement('a');a.href=url;a.textContent=match[4];a.target='_blank';a.rel='noopener noreferrer';parent.append(a);}else parent.append(document.createTextNode(match[0]));}
  }parent.append(document.createTextNode(text.slice(end)));
}
function render(node,text,sources,prefix){
  node.replaceChildren();const lines=text.split('\n');let i=0;
  while(i<lines.length){
    if(lines[i].startsWith('```')){const pre=document.createElement('pre');const block=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))block.push(lines[i++]);pre.textContent=block.join('\n');node.append(pre);i++;continue;}
    if(lines[i].includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+/.test(lines[i+1])){
      const table=document.createElement('table');let header=true;
      for(;i<lines.length&&lines[i].includes('|');i++){
        if(/^\s*\|?\s*:?-+/.test(lines[i]))continue;
        const tr=document.createElement('tr');for(const cell of lines[i].replace(/^\s*\||\|\s*$/g,'').split('|')){const el=document.createElement(header?'th':'td');if(header)el.scope='col';inline(el,cell.trim(),sources,prefix);tr.append(el);}table.append(tr);header=false;
      }node.append(table);continue;
    }
    if(/^\s*[-*]\s+/.test(lines[i])){const ul=document.createElement('ul');while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){const li=document.createElement('li');inline(li,lines[i++].replace(/^\s*[-*]\s+/,''),sources,prefix);ul.append(li);}node.append(ul);continue;}
    const line=lines[i++];if(!line.trim())continue;
    const heading=/^(#{1,4})\s+(.*)/.exec(line);const p=document.createElement(heading?'h3':'p');inline(p,heading?heading[2]:line,sources,prefix);node.append(p);
  }
}
function message(role,text=''){
  const article=document.createElement('article');article.className=`message ${role}`;const title=document.createElement('h2');title.textContent=role==='user'?'You':'Fieldnote';const body=document.createElement('div');body.className='body';body.textContent=text;article.append(title,body);thread.append(article);return {article,body};
}
function setBusy(value){$('send').disabled=value;input.disabled=value;$('new').disabled=value;$('stop').hidden=!value;for(const b of document.querySelectorAll('[data-prompt]'))b.disabled=value;}
$('stop').onclick=()=>active?.abort();
$('new').onclick=()=>{conversationId=crypto.randomUUID();try{localStorage.setItem('fieldnote-conversation',conversationId);}catch{}for(const m of thread.querySelectorAll('.message'))m.remove();$('intro').hidden=false;status.textContent='New chat. You can still ask about earlier research.';input.focus();};
for(const button of document.querySelectorAll('[data-prompt]'))button.onclick=()=>{input.value=button.dataset.prompt;$('form').requestSubmit();};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!active)$('form').requestSubmit();}});
$('form').addEventListener('submit',async e=>{
  e.preventDefault();const question=input.value.trim();if(!question||active)return;
  $('intro').hidden=true;message('user',question);input.value='';const reply=message('assistant');const sourceList=document.createElement('ol');sourceList.className='sources';reply.article.append(sourceList);
  const prefix=`turn-${crypto.randomUUID()}`;const sources=new Map();let text='',done=false,failed=false;
  const controller=new AbortController();active=controller;setBusy(true);status.textContent='Thinking…';
  const showSources=items=>{sources.clear();sourceList.replaceChildren();for(const s of items){const url=safeURL(s.url);if(!url)continue;sources.set(s.n,s);const li=document.createElement('li');li.id=`${prefix}-source-${s.n}`;li.value=s.n;const a=document.createElement('a');a.href=url;a.textContent=s.title;a.target='_blank';a.rel='noopener noreferrer';const small=document.createElement('small');small.textContent=s.domain+(s.publishedDate?' · '+s.publishedDate.slice(0,10):'');li.append(a,small);sourceList.append(li);}render(reply.body,text,sources,prefix);};
  function event(frame){const lines=frame.split('\n');const type=lines.find(l=>l.startsWith('event:'))?.slice(6).trim();const raw=lines.filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trimStart()).join('\n');if(!raw)return;const data=JSON.parse(raw);
    if(type==='status')status.textContent=data.type==='searching'?`Searching: ${data.query}`:'Thinking…';
    if(type==='sources')showSources(data.sources);
    if(type==='text'){text+=data.delta;render(reply.body,text,sources,prefix);status.textContent='Writing…';}
    if(type==='done'){done=true;status.textContent=`Saved to your research history. ${(data.timings.totalMs/1000).toFixed(1)}s`;}
    if(type==='error'){failed=true;throw new Error(data.message);}
  }
  try{
    const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:question,userId,conversationId,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone}),signal:controller.signal});
    if(!response.ok)throw new Error((await response.json()).error||'Unable to start the reply.');
    if(!response.body)throw new Error('Streaming is unavailable in this browser.');
    const reader=response.body.getReader();const decoder=new TextDecoder();let pending='';
    try{while(true){const chunk=await reader.read();pending+=decoder.decode(chunk.value,{stream:!chunk.done});let boundary;while((boundary=pending.indexOf('\n\n'))!==-1){event(pending.slice(0,boundary));pending=pending.slice(boundary+2);}if(chunk.done)break;}if(pending.trim())event(pending);}finally{reader.releaseLock();}
    if(!done&&!failed)throw new Error('The connection ended before the reply finished. Please try again.');
  }catch(error){controller.abort();const note=document.createElement('p');note.className='error';note.setAttribute('role','alert');note.textContent=error.name==='AbortError'?'Reply stopped. You can ask another question.':error.message;reply.article.append(note);status.textContent='Reply incomplete.';}
  finally{active=null;setBusy(false);input.focus();}
});
</script>
</body>
</html>
